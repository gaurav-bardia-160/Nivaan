name: GovBank Assistant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic rapidfuzz pytest pdfplumber deep-translator qdrant-client sentence-transformers httpx

    - name: Verify Python Compilation
      run: |
        python -m py_compile backend/main.py backend/pipeline.py backend/schemas.py backend/config.py backend/modules/*.py

    - name: Verify JavaScript Syntax
      run: |
        node -c frontend/app.js

    - name: Run Pytest Test Suite
      env:
        RAG_ENABLED: "true"
      run: |
        pytest tests/ -v
