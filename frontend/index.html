<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="Nivaan - AI Chatbot for Indian government, banking, and legal procedures.">
    <title>Nivaan</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css?v=20261117b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-app">
        <!-- Minimal Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat-btn" id="newChatBtn">
                    <span class="icon">➕</span>
                    <span>New chat</span>
                </button>
            </div>


            <!-- Chat History -->
            <div class="chat-history-section">
                <div class="history-heading">Recent Inquiries</div>
                <div class="history-list" id="historyList">
                    <!-- History items injected dynamically -->
                </div>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Close sidebar"></div>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Header Bar -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
                    <div class="header-brand">
                        <img src="logo.png" alt="Nivaan Logo" class="brand-logo" />
                        <div>
                            <h1 class="brand-title">Nivaan</h1>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <button id="themeToggleBtn" class="pill-btn theme-btn" title="Toggle theme">🌙</button>
                    <span id="backendBadge" class="connection-badge connecting" title="Connecting to backend at http://127.0.0.1:8000...">● Connecting...</span>
                </div>
            </header>

            <!-- Chat Messages Timeline -->
            <div class="messages-container" id="messagesContainer">
                <!-- Welcome View (when chat is empty) -->
                <div class="welcome-screen" id="welcomeScreen">
                    <h2 class="welcome-title">How can I help with official procedures today?</h2>

                    <!-- Quick Prompt Suggestions -->
                    <div class="suggestion-grid">
                        <button class="suggestion-card" data-prompt="How do I apply for a new PAN card online?">
                            <span class="card-icon">🪪</span>
                            <strong>Apply for PAN Card</strong>
                            <p>Form 49A steps, fees & documents</p>
                        </button>
                        <button class="suggestion-card" data-prompt="What documents do I need to file ITR-1 tax return?">
                            <span class="card-icon">📊</span>
                            <strong>File ITR-1 Return</strong>
                            <p>Income tax filing basics & proofs</p>
                        </button>
                        <button class="suggestion-card" data-prompt="What are the RBI rules on loan prepayment and foreclosure penalties?">
                            <span class="card-icon">🏦</span>
                            <strong>Loan Prepayment Rules</strong>
                            <p>RBI rules on floating rate penalty bans</p>
                        </button>
                        <button class="suggestion-card" data-prompt="What should I do if I receive a cheque bounce notice under Section 138?">
                            <span class="card-icon">⚖️</span>
                            <strong>Cheque Bounce Notice</strong>
                            <p>Deadlines, 15-day notice & legal steps</p>
                        </button>
                    </div>
                </div>
                <!-- Dynamic messages appended here -->
            </div>

            <!-- Bottom Floating Input Area -->
            <div class="input-wrapper">
                <!-- File Attachment Preview Pill -->
                <div class="attachment-preview" id="attachmentPreview" style="display: none;">
                    <span class="preview-icon" id="previewIcon">📎</span>
                    <span class="preview-filename" id="previewFilename">document.pdf</span>
                    <button class="remove-attachment-btn" id="removeAttachmentBtn" title="Remove attachment">&times;</button>
                </div>

                <!-- Input Box Bar -->
                <div class="input-bar">
                    <!-- Hidden File Input (supports documents and camera capture) -->
                    <input 
                        type="file" 
                        id="fileInput" 
                        accept="application/pdf,text/plain,text/markdown,text/csv,.txt,.md,.csv,image/*,.png,.jpg,.jpeg,.webp"
                        style="display: none;"
                    >

                    <!-- Supported document attachment -->
                    <button class="btn-attach" id="attachBtn" title="Upload a text file, image, or text-based PDF">
                        <span>📎</span>
                    </button>

                    <!-- Camera capture -->
                    <button class="btn-attach" id="cameraBtn" title="Take a photo of a document or notice" aria-label="Camera Capture">
                        <img src="camera.png" alt="Camera" class="camera-btn-icon" />
                    </button>

                    <!-- Text Input -->
                    <textarea 
                        id="chatInput" 
                        rows="1" 
                        placeholder="Ask a question or upload a notice/form..." 
                    ></textarea>

                    <!-- Send Button -->
                    <button class="btn-send" id="sendBtn" title="Send message">
                        <span id="sendIcon">➤</span>
                        <span class="send-spinner" id="sendSpinner" style="display: none;"></span>
                    </button>
                </div>
                <div class="privacy-note">
                    Terms & Conditions apply
                </div>
            </div>
        </main>
    </div>

    <!-- Main Controller Script -->
    <script src="app.js?v=20261117b"></script>
</body>
</html>
