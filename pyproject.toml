[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nivaan"
version = "1.0.0"
description = "Grounded, privacy-aware civic assistant for Indian government, banking, and legal procedures"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nivaan Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "playwright>=1.40.0",
    "qdrant-client[fastembed]>=1.12.0,<2.0.0",
    "deep-translator>=1.11.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "pypdfium2>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.8.0",
    "duckduckgo-search>=6.0.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
